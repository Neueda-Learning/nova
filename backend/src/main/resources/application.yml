spring:
  application:
    name: portfolio
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

server:
  port: 8080

openexchangerates:
  base-url: https://openexchangerates.org/api
  app-id: ${OXR_APP_ID:a66ae9ab55ba41cd93d76b34a79dbc4d}

